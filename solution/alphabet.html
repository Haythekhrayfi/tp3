<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>L'alphabet</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #list>li{
      list-style-image: url(../images/check.png);
}
#none>circle{
        list-style: circle;

    }
     #dot{
        list-style: disc;
     }
    
    </style>
    

</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>Lettres de l'alphabet</h1>
        </div>
    
    <ol class="card">
        <li>Les <strong>voyelles</strong>
            <p>Il y a 6 voyelles</p>
            <ul id="dot">
                <li>a</li>
                <li>e</li>
                <li id="circle">i</li>
                <li>o</li>
                <li>u</li>
                <li>y</li>
            </ul>
        </li>
        <li>Les <strong>consonnes</strong>:
            Il y a <em>20</em> consonnes
            <ul id="list">
                <li >b, c, d</li>
                <li >f,g,h</li>
                <li >j,k,l,m,n</li>
                <li >p, q, r, s, t</li>
                <li >v,w,x,z</li>
            </ul>
        </li>
<a href="../index.html">Retour à l'accueil </a>
    </ol>
        
</div>
</body>
</html>
